name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      resources:
        description: "Fixtures to run, comma or space separated (e.g. 'redis-cache, event-hub'). Empty runs the full matrix. Fixtures commented out of .github/conformance-matrix.txt can be named here too - that is how you re-check an excluded one."
        required: false
        type: string
      phase:
        description: "Which conformance phase to run"
        required: false
        default: both
        type: choice
        options: [both, crud, discovery]

# Serialize conformance across CI runs (and with nightly) so matrix jobs
# don't race for the same Azure test subscription. cancel-in-progress=false
# lets an in-flight run finish and cleanup rather than being killed mid-create.
concurrency:
  group: azure-conformance-tests
  cancel-in-progress: false

jobs:
  reuse-compliance:
    name: REUSE License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Build
        run: make build

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

      - name: Unit tests
        run: make test-unit

      - name: Validate Pkl manifest
        run: |
          pkl eval formae-plugin.pkl --format json > /dev/null
          echo "Manifest validated successfully"

      - name: Verify schema
        run: make verify-schema

  # Integration tests are mock-based (fake SDK clients) and need no cloud creds.
  # Run on PRs too so they gate merges alongside conformance.
  test-integration:
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run integration tests
        run: make test-integration

  # Clear stale test resources before the conformance matrix runs, so a prior
  # aborted run can't collide with this one.
  pre-cleanup:
    needs: [checks, test-integration]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Azure Credentials
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Clean up test resources
        run: ./scripts/ci/clean-environment.sh

  # Conformance runs the full CRUD + discovery lifecycle against real Azure
  # resources on every push, PR, and manual dispatch — so it gates merges.
  # The matrix is curated (not auto-discovered) to exclude resources with known
  # formae-core discovery bugs; see the exclusions below.
  # Both this workflow and nightly.yml build their conformance matrix from
  # .github/conformance-matrix.txt so the two can never drift apart again.
  conformance-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      resources: ${{ steps.build.outputs.resources }}
    steps:
      - uses: actions/checkout@v7
      - id: build
        # SELECTED is passed through env, never interpolated into the script, so a
        # dispatch input cannot inject shell.
        env:
          SELECTED: ${{ inputs.resources }}
        run: |
          set -euo pipefail
          if [ -n "${SELECTED:-}" ]; then
            # Split on commas and whitespace, drop blanks, de-duplicate.
            RESOURCES=$(printf '%s' "$SELECTED" | tr ', ' '\n\n' \
              | jq -Rsc 'split("\n") | map(select(length > 0)) | unique')
            test "$(echo "$RESOURCES" | jq 'length')" -gt 0 \
              || { echo "::error::resources input had no fixture names"; exit 1; }
            # Validate against testdata/ rather than the matrix: an unknown name would
            # otherwise become a job that filters to nothing and passes green, and
            # naming a fixture excluded from the matrix is a deliberate use of this input.
            MISSING=$(echo "$RESOURCES" | jq -r '.[]' | while IFS= read -r r; do
              [ -f "testdata/${r}.pkl" ] || printf ' %s' "$r"
            done)
            if [ -n "$MISSING" ]; then
              echo "::error::no such fixture(s):$MISSING - expected testdata/<name>.pkl"
              exit 1
            fi
            echo "$RESOURCES" | jq -r 'length as $n | "conformance matrix: \($n) resource(s) selected by hand"'
          else
            RESOURCES=$(grep -vE '^[[:space:]]*(#|$)' .github/conformance-matrix.txt | jq -R . | jq -sc .)
            echo "$RESOURCES" | jq -r 'length as $n | "conformance matrix: \($n) resources"'
          fi
          test "$(echo "$RESOURCES" | jq 'length')" -gt 0
          echo "resources=$RESOURCES" >> "$GITHUB_OUTPUT"

  conformance-tests:
    needs: [checks, test-integration, pre-cleanup, conformance-matrix]
    runs-on: ubuntu-latest
    # 120 min: App Gateway and Front Door each run the CRUD lifecycle + discovery.
    # A single Front Door cdn-* lifecycle measures ~36 min; App Gateway ~35 min.
    # Fast resources finish well under this.
    timeout-minutes: 120

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        resource: ${{ fromJSON(needs.conformance-matrix.outputs.resources) }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Configure Azure Credentials
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install plugin
        run: make install

      # CRUD and discovery run as separate steps with a fresh azure/login between
      # them. A single OIDC token stops refreshing partway through a long job
      # (App Gateway's lifecycle alone is ~35 min), after which every List fails
      # with "DefaultAzureCredential: failed to acquire a token". Re-authenticating
      # before discovery keeps each phase inside a fresh ~1h token window.
      #
      # FORMAE_TEST_FILTER scopes each job to its one resource — without it the
      # whole suite runs in every matrix job (20x work) and jobs delete each
      # other's resources. Cleanup is owned by the pre-/conformance-cleanup jobs;
      # the Makefile skips its inline cleanup when the filter is set.
      - name: Run CRUD conformance (${{ matrix.resource }})
        if: ${{ inputs.phase != 'discovery' }}
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          FORMAE_TEST_FILTER: ${{ matrix.resource }}
          FORMAE_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.resource }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          set -euo pipefail
          TIMEOUT_ARG=""
          # App Gateway v2 and Front Door are slow to provision. FORMAE_TEST_TIMEOUT
          # is the per-command poll (default 5 min — too short); TIMEOUT is the overall
          # go-test timeout. Front Door's full CRUD lifecycle (create+update+destroy+
          # recreate+OOB-delete) measures ~36 min clean, so cdn-* needs a wide margin.
          case "${{ matrix.resource }}" in
            application-gateway)
              export FORMAE_TEST_TIMEOUT=20 FORMAE_TEST_OOB_TIMEOUT=20 FORMAE_TEST_OOB_DELETE_TIMEOUT=20
              TIMEOUT_ARG="TIMEOUT=50"
              ;;
            cdn-*)
              export FORMAE_TEST_TIMEOUT=25 FORMAE_TEST_OOB_TIMEOUT=25 FORMAE_TEST_OOB_DELETE_TIMEOUT=25
              TIMEOUT_ARG="TIMEOUT=75"
              ;;
            flux-configuration|maintenance-configuration|trusted-access-role-binding|grafana|grafana-managed-private-endpoint)
              # An AKS cluster or a managed Grafana workspace takes ~5-10 min before the
              # resource under test can even be created.
              export FORMAE_TEST_TIMEOUT=20 FORMAE_TEST_OOB_TIMEOUT=20 FORMAE_TEST_OOB_DELETE_TIMEOUT=20
              TIMEOUT_ARG="TIMEOUT=50"
              ;;
            virtual-machine-extension)
              export FORMAE_TEST_TIMEOUT=15 FORMAE_TEST_OOB_TIMEOUT=15 FORMAE_TEST_OOB_DELETE_TIMEOUT=15
              TIMEOUT_ARG="TIMEOUT=40"
              ;;
            redis-cache)
              # Azure Redis Basic C0 is the slowest create in the matrix: it used the
              # full 20 min budget on the previous attempt and still timed out on
              # Create. 30 min is the observed ceiling for the tier.
              export FORMAE_TEST_TIMEOUT=30 FORMAE_TEST_OOB_TIMEOUT=30 FORMAE_TEST_OOB_DELETE_TIMEOUT=30
              TIMEOUT_ARG="TIMEOUT=70"
              ;;
            cosmos-database-account|configuration|database|firewall-rule|flexible-server|web-pubsub|signalr-service)
              # Managed data services: the control plane accepts the create call in
              # seconds but the instance is not Succeeded for 10-20 min, and Destroy
              # is just as slow. Each of these blew the default 5 min per-command
              # poll on a single phase (redis-cache and configuration on Create,
              # cosmos-database-account on Destroy, database on the OOB-delete
              # re-apply) while every other phase passed.
              export FORMAE_TEST_TIMEOUT=20 FORMAE_TEST_OOB_TIMEOUT=20 FORMAE_TEST_OOB_DELETE_TIMEOUT=20
              TIMEOUT_ARG="TIMEOUT=50"
              ;;
            sql-*)
              # 20 not 15: sql-firewall-rule timed out on the OOB-delete re-apply at
              # 17 min, and sql-virtual-network-rule on the out-of-band server create
              # at 15 min. Both spend most of that waiting on the parent SQL server.
              export FORMAE_TEST_TIMEOUT=20 FORMAE_TEST_OOB_TIMEOUT=20 FORMAE_TEST_OOB_DELETE_TIMEOUT=20
              TIMEOUT_ARG="TIMEOUT=50"
              ;;
          esac
          make conformance-test-crud-run $TIMEOUT_ARG

      - name: Re-authenticate for discovery
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run discovery conformance (${{ matrix.resource }})
        if: ${{ inputs.phase != 'crud' }}
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          FORMAE_TEST_FILTER: ${{ matrix.resource }}
          FORMAE_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.resource }}
          FORMAE_TEST_DISCOVERY_TIMEOUT: "5"
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          set -euo pipefail
          TIMEOUT_ARG=""
          case "${{ matrix.resource }}" in
            application-gateway)
              export FORMAE_TEST_TIMEOUT=20 FORMAE_TEST_OOB_TIMEOUT=20 FORMAE_TEST_OOB_DELETE_TIMEOUT=20 FORMAE_TEST_DISCOVERY_TIMEOUT=20
              TIMEOUT_ARG="TIMEOUT=50"
              ;;
            cdn-*)
              export FORMAE_TEST_TIMEOUT=25 FORMAE_TEST_OOB_TIMEOUT=25 FORMAE_TEST_OOB_DELETE_TIMEOUT=25 FORMAE_TEST_DISCOVERY_TIMEOUT=25
              TIMEOUT_ARG="TIMEOUT=75"
              ;;
            flux-configuration|maintenance-configuration|trusted-access-role-binding|grafana|grafana-managed-private-endpoint)
              export FORMAE_TEST_TIMEOUT=20 FORMAE_TEST_OOB_TIMEOUT=20 FORMAE_TEST_OOB_DELETE_TIMEOUT=20 FORMAE_TEST_DISCOVERY_TIMEOUT=20
              TIMEOUT_ARG="TIMEOUT=50"
              ;;
            virtual-machine-extension)
              export FORMAE_TEST_TIMEOUT=15 FORMAE_TEST_OOB_TIMEOUT=15 FORMAE_TEST_OOB_DELETE_TIMEOUT=15 FORMAE_TEST_DISCOVERY_TIMEOUT=15
              TIMEOUT_ARG="TIMEOUT=40"
              ;;
            redis-cache)
              export FORMAE_TEST_TIMEOUT=30 FORMAE_TEST_OOB_TIMEOUT=30 FORMAE_TEST_OOB_DELETE_TIMEOUT=30 FORMAE_TEST_DISCOVERY_TIMEOUT=30
              TIMEOUT_ARG="TIMEOUT=70"
              ;;
            sql-*|cosmos-database-account|configuration|database|firewall-rule|flexible-server|web-pubsub|signalr-service)
              # Discovery has to stand the resource up first, so it inherits the same
              # slow control planes as the CRUD phase above.
              export FORMAE_TEST_TIMEOUT=20 FORMAE_TEST_OOB_TIMEOUT=20 FORMAE_TEST_OOB_DELETE_TIMEOUT=20 FORMAE_TEST_DISCOVERY_TIMEOUT=20
              TIMEOUT_ARG="TIMEOUT=50"
              ;;
          esac
          make conformance-test-discovery-run $TIMEOUT_ARG

  # Clean up Azure resources after all matrix jobs complete (always runs).
  conformance-cleanup:
    needs: [conformance-tests]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Azure Credentials
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Clean up test resources
        run: ./scripts/ci/clean-environment.sh

  # Notify when build is fixed (was red, now green)
  notify-fixed:
    needs: [checks]
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'push'
    steps:
      - name: Check if previous run failed
        id: check_previous
        uses: actions/github-script@v9
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: context.ref.replace('refs/heads/', ''),
              per_page: 2,
              status: 'completed'
            });

            // Get previous run (skip current which isn't completed yet)
            const previousRun = runs.data.workflow_runs.find(run => run.id !== context.runId);

            if (previousRun && previousRun.conclusion === 'failure') {
              return 'true';
            }
            return 'false';
          result-encoding: string

      - name: Notify Slack (Fixed)
        if: steps.check_previous.outputs.result == 'true'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":white_check_mark: CI fixed on ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *CI fixed* on `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

  # Notify on failure
  notify-failure:
    needs: [checks]
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'push'
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: CI failed on ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *CI failed* on `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
