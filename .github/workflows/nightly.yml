name: Nightly

# Tests plugin against formae main branch to catch SDK regressions before release.
# PEL-maintained plugins only.

on:
  schedule:
    - cron: '0 3 * * *'  # 3 AM UTC
  workflow_dispatch:
    inputs:
      formae_branch:
        description: "Formae Git branch or tag to build from (default: 0.84.0)"
        required: false
        default: "0.84.0"
        type: string
      formae_version:
        description: "Canonical candidate version (X.Y.Z); leave empty for normal nightly behavior"
        required: false
        default: ""
        type: string
      skip_makefile_align:
        description: "Skip Makefile branch alignment (test the triggered branch as-is)"
        required: false
        default: false
        type: boolean

# Share the conformance lock with ci.yml so nightly and CI never run
# conformance against the same Azure test subscription at once.
concurrency:
  group: azure-conformance-tests
  cancel-in-progress: false

jobs:
  # Integration tests are mock-based (fake SDK clients) and need no cloud creds.
  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run integration tests
        run: make test-integration

  # Build formae once and share the binary across conformance jobs
  build-formae:
    needs: [test-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build formae
        env:
          FORMAE_BRANCH: ${{ inputs.formae_branch || 'main' }}
          FORMAE_VERSION: ${{ inputs.formae_version || '' }}
        run: |
          set -euo pipefail
          if [ -n "$FORMAE_VERSION" ] && ! [[ "$FORMAE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::formae_version must be canonical numeric X.Y.Z (got: $FORMAE_VERSION)"
            exit 1
          fi
          echo "Building formae from ref: ${FORMAE_BRANCH}"
          git clone --branch "$FORMAE_BRANCH" --depth 1 https://github.com/platform-engineering-labs/formae.git /tmp/formae
          cd /tmp/formae
          git fetch --tags --unshallow
          FORMAE_CORE_SHA="$(git rev-parse HEAD)"
          echo "Resolved formae commit: $FORMAE_CORE_SHA"
          if [ -n "$FORMAE_VERSION" ]; then
            make build VERSION="$FORMAE_VERSION"
          else
            make build
          fi
          FORMAE_VERSION_OUTPUT="$(/tmp/formae/formae --version)"
          printf '%s\n' "$FORMAE_VERSION_OUTPUT"
          FORMAE_VERSION_LINE="$(printf '%s\n' "$FORMAE_VERSION_OUTPUT" | sed -n '1p')"
          if [ -n "$FORMAE_VERSION" ]; then
            test "$FORMAE_VERSION_LINE" = "formae version: $FORMAE_VERSION" \
              || { echo "::error::built formae did not report requested version $FORMAE_VERSION"; exit 1; }
          fi
          mkdir -p /tmp/formae-install/bin /tmp/formae-install/.ops
          touch /tmp/formae-install/.ops/.keep
          {
            printf 'core_sha=%s\n' "$FORMAE_CORE_SHA"
            printf 'version=%s\n' "$FORMAE_VERSION_LINE"
          } > /tmp/formae-install/.ops/formae-build-metadata
          cp /tmp/formae/formae /tmp/formae-install/bin/formae

      - name: Track formae clone
        if: env.POSTHOG_API_KEY != ''
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          REPO=$(basename "$(git remote get-url origin)" .git 2>/dev/null || echo "unknown")
          curl -sf -o /dev/null https://k.platform.engineering/capture/ \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg api_key "$POSTHOG_API_KEY" \
              --arg repo "$REPO" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg run_id "${GITHUB_RUN_ID:-}" \
              '{
                api_key: $api_key,
                distinct_id: "formae-ci",
                event: "ci_repo_clone",
                timestamp: $ts,
                properties: {
                  "$process_person_profile": false,
                  repo: $repo,
                  cloned_repo: "formae",
                  ci_run_id: $run_id
                }
              }')" || echo "[telemetry] event send failed (non-critical)" >&2

      - name: Upload formae install tree
        uses: actions/upload-artifact@v7
        with:
          name: formae-install
          path: /tmp/formae-install
          include-hidden-files: true
          retention-days: 1

      - name: Upload formae source (for replace directives)
        uses: actions/upload-artifact@v7
        with:
          name: formae-source
          path: /tmp/formae
          retention-days: 1

  # Shared with ci.yml: both workflows build the matrix from
  # .github/conformance-matrix.txt. Nightly used to keep its own hand-maintained
  # list and had silently fallen 100 resources behind CI.
  conformance-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      resources: ${{ steps.build.outputs.resources }}
    steps:
      - uses: actions/checkout@v7
      - id: build
        run: |
          set -euo pipefail
          RESOURCES=$(grep -vE '^[[:space:]]*(#|$)' .github/conformance-matrix.txt | jq -R . | jq -sc .)
          test "$(echo "$RESOURCES" | jq 'length')" -gt 0
          echo "resources=$RESOURCES" >> "$GITHUB_OUTPUT"
          echo "$RESOURCES" | jq -r 'length as $n | "conformance matrix: \($n) resources"'

  conformance-tests-main:
    needs: [build-formae, conformance-matrix]
    runs-on: ubuntu-latest
    # 120 min: Front Door (cdn-*) and App Gateway lifecycles run ~36 min each.
    timeout-minutes: 120
    environment: production

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        resource: ${{ fromJSON(needs.conformance-matrix.outputs.resources) }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Download formae install tree
        uses: actions/download-artifact@v8
        with:
          name: formae-install
          path: /tmp/formae-install

      - name: Download formae source
        uses: actions/download-artifact@v8
        with:
          name: formae-source
          path: /tmp/formae

      - name: Set up formae binary
        run: |
          test -d /tmp/formae-install/.ops
          chmod +x /tmp/formae-install/bin/formae
          echo "FORMAE_BINARY=/tmp/formae-install/bin/formae" >> $GITHUB_ENV
          /tmp/formae-install/bin/formae --version

      # Temporary: until Orbital package manager handles plugin version
      # coordination, the formae Makefile is the source of truth for which
      # plugin branch to build against. Parse the @ref suffix and check
      # out that ref so the plugin is compatible with the formae binary.
      - name: Align plugin branch with formae Makefile
        if: ${{ !inputs.skip_makefile_align }}
        run: |
          PLUGIN_NAME=$(basename "${{ github.repository }}")
          REF=$(grep "${PLUGIN_NAME}" /tmp/formae/Makefile \
            | grep -o '@[^[:space:]\\]*' \
            | head -1 \
            | sed 's/^@//')
          if [ -n "$REF" ]; then
            echo "Formae Makefile pins ${PLUGIN_NAME} to ref: ${REF}"
            git fetch origin "${REF}"
            git checkout "${REF}"
          else
            echo "No ref override for ${PLUGIN_NAME}, staying on default branch"
          fi

      # Candidate conformance must use the matching published core schema, not
      # the pinned release dependency. This rewrites only the runner checkout;
      # scheduled and normal dispatch runs leave the project and lock untouched.
      - name: Resolve candidate formae schema dependency
        env:
          FORMAE_VERSION: ${{ inputs.formae_version || '' }}
        run: |
          set -euo pipefail
          if [ -z "$FORMAE_VERSION" ]; then
            echo "No formae_version supplied; retaining checked-out schema dependency"
            exit 0
          fi
          if ! [[ "$FORMAE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::formae_version must be canonical numeric X.Y.Z (got: $FORMAE_VERSION)"
            exit 1
          fi
          PROJECT_FILE=schema/pkl/PklProject
          LOCK_FILE=schema/pkl/PklProject.deps.json
          EXPECTED_URI="package://hub.platform.engineering/plugins/pkl/schema/pkl/formae/formae@$FORMAE_VERSION"
          python3 - "$PROJECT_FILE" "$EXPECTED_URI" <<'PY'
          from pathlib import Path
          import re
          import sys

          project_file = Path(sys.argv[1])
          expected_uri = sys.argv[2]
          original = project_file.read_text()
          pattern = r'(?m)^([ \t]*uri[ \t]*=[ \t]*)"package://hub\.platform\.engineering/plugins/pkl/schema/pkl/formae/formae@[^"\s]+"([ \t]*)$'
          rewritten, replacements = re.subn(pattern, rf'\1"{expected_uri}"\2', original)
          if replacements != 1:
              raise SystemExit(f"expected exactly one formae URI in {project_file}, found {replacements}")
          expected_pattern = rf'(?m)^[ \t]*uri[ \t]*=[ \t]*"{re.escape(expected_uri)}"[ \t]*$'
          if len(re.findall(expected_pattern, rewritten)) != 1:
              raise SystemExit(f"expected exactly one requested formae URI in {project_file}")
          project_file.write_text(rewritten)
          PY
          # Resolving PklProject evaluates package.version before make install
          # has generated this ignored file. Use the plugin's declared version.
          pkl eval -x version formae-plugin.pkl > schema/pkl/VERSION
          rm -f "$LOCK_FILE"
          pkl project resolve --cache-dir /tmp/pkl-candidate-cache schema/pkl
          test -s "$LOCK_FILE" \
            || { echo "::error::candidate Pkl dependency resolve did not create $LOCK_FILE"; exit 1; }
          EXPECTED_LOCK_URI="project$EXPECTED_URI"
          LOCK_MATCHES="$(jq --arg expected "$EXPECTED_LOCK_URI" '[.resolvedDependencies | to_entries[] | select(.value.uri == $expected and (.value.checksums.sha256 | type == "string") and (.value.checksums.sha256 | test("^[0-9a-f]{64}$")))] | length' "$LOCK_FILE")"
          FORMAE_LOCK_URIS_MATCH="$(jq --arg expected "$EXPECTED_LOCK_URI" '[.resolvedDependencies | to_entries[] | select((.value.uri? // "") | contains("/formae/formae@")) | .value.uri] | length == 1 and all(.[]; . == $expected)' "$LOCK_FILE")"
          test "$LOCK_MATCHES" -eq 1 && test "$FORMAE_LOCK_URIS_MATCH" = true \
            || { echo "::error::candidate Pkl lock did not contain exactly one requested formae URI with SHA-256 checksum"; exit 1; }
          echo "Resolved candidate schema: $EXPECTED_URI"
          jq -r --arg expected "$EXPECTED_LOCK_URI" '.resolvedDependencies | to_entries[] | select(.value.uri == $expected) | "Resolved candidate schema checksum: \(.value.checksums.sha256)"' "$LOCK_FILE"

      - name: Configure Azure Credentials
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Inject formae replace directives
        run: |
          FORMAE_SRC=/tmp/formae
          for pkg in pkg/auth pkg/model pkg/plugin pkg/plugin-conformance-tests; do
            if grep -q "formae/$pkg" go.mod 2>/dev/null; then
              echo "Injecting replace for $pkg -> $FORMAE_SRC/$pkg"
              go mod edit -replace "github.com/platform-engineering-labs/formae/$pkg=$FORMAE_SRC/$pkg"
            fi
          done
          go mod tidy

      - name: Install plugin
        run: make install

      - name: Run conformance tests against main (${{ matrix.resource }})
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          FORMAE_TEST_RUN_ID: nightly-main-${{ github.run_id }}-${{ matrix.resource }}
          FORMAE_TEST_FILTER: ${{ matrix.resource }}
          # Wide per-command poll so slow resources (App Gateway, Front Door cdn-*)
          # don't time out; fast resources return well before these ceilings.
          FORMAE_TEST_TIMEOUT: "25"
          FORMAE_TEST_OOB_TIMEOUT: "25"
          FORMAE_TEST_OOB_DELETE_TIMEOUT: "25"
          FORMAE_TEST_DISCOVERY_TIMEOUT: "25"
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          FORMAE_TEST_PROVIDER_DEFAULT_OBSERVATIONS: /tmp/provider-default-observations.json
        run: bash scripts/ci/run-conformance-phase.sh "${{ matrix.resource }}" all

      # The omit-and-observe records for hasProviderDefault fields. Uploaded even
      # when the case fails: a field the provider populates that the schema does
      # not annotate is reported as a comparison failure, so a red case carries
      # exactly the observation worth reading.
      - name: Upload provider-default observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-default-observations-${{ matrix.resource }}
          path: /tmp/provider-default-observations.json
          if-no-files-found: ignore

  # Clean up Azure resources after all matrix jobs complete
  cleanup:
    needs: [conformance-tests-main]
    runs-on: ubuntu-latest
    if: always()
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Configure Azure Credentials
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Clean up test resources
        run: ./scripts/ci/clean-environment.sh

  # Notify when nightly is fixed (was red, now green). Scheduled runs only,
  # so branch dispatches do not post or pollute the comparison.
  notify-fixed:
    needs: [test-integration, conformance-tests-main]
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'schedule'
    steps:
      - name: Check if previous run failed
        id: check_previous
        uses: actions/github-script@v9
        with:
          script: |
            // A rerun of this same run counts as fixed if the prior attempt failed.
            const attempt = parseInt(process.env.GITHUB_RUN_ATTEMPT || '1', 10);
            if (attempt > 1) {
              const prev = await github.rest.actions.getWorkflowRunAttempt({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                attempt_number: attempt - 1
              });
              if (prev.data.conclusion === 'failure') {
                return 'true';
              }
            }

            // Otherwise compare against the previous scheduled run on main;
            // unfiltered, a dispatched branch run would shadow the comparison.
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'nightly.yml',
              branch: 'main',
              event: 'schedule',
              per_page: 2,
              status: 'completed'
            });

            const previousRun = runs.data.workflow_runs.find(run => run.id !== context.runId);

            if (previousRun && previousRun.conclusion === 'failure') {
              return 'true';
            }
            return 'false';
          result-encoding: string

      - name: Notify Slack (Fixed)
        if: steps.check_previous.outputs.result == 'true'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":white_check_mark: Nightly fixed on ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *Nightly fixed* on `${{ github.repository }}`\n\nPlugin conformance tests now passing against formae main branch."
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

  # Notify on failure. Scheduled runs only, so branch dispatches do not alert.
  notify-failure:
    needs: [test-integration, conformance-tests-main]
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'schedule'
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":warning: Nightly build failed on ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Nightly build failed* on `${{ github.repository }}`\n\nPlugin conformance tests failed against formae main branch. This may indicate an SDK regression."
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
